<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Liga SC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Liga del Rocódromo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Estilo «Competición»: oscuro como un marcador de estadio, oro para el líder, rosa de cinta exprés como acento. Títulos en mayúsculas con letra estrecha de marcador. Un solo tema oscuro a propósito. */
:root{--gold:#ffc53d;--silver:#c3ced6;--bronze:#e0955a;--red:#ff4d5a;--bg:#0f1720;--card:#18232e;--ink:#eef3f6;--mut:#8ea0ad;--line:#26333f;--acc:#ff3d7f;--deep:#ff3d7f;--wall:#2b3a47;--wall2:#6f8797;--floor:#16212b;--block:#22303c;--wallsel:#ff3d7f;--g1:#3fd28b;--g2:#ffb83d;--g3:#ff6b5b;--g4:#c49bff;--disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#ffc53d;--silver:#c3ced6;--bronze:#e0955a;--red:#ff4d5a;--bg:#0f1720;--card:#18232e;--ink:#eef3f6;--mut:#8ea0ad;--line:#26333f;--acc:#ff3d7f;--deep:#ff3d7f;--wall:#2b3a47;--wall2:#6f8797;--floor:#16212b;--block:#22303c;--wallsel:#ff3d7f;--g1:#3fd28b;--g2:#ffb83d;--g3:#ff6b5b;--g4:#c49bff;color-scheme:dark}}
:root[data-theme="dark"]{--gold:#ffc53d;--silver:#c3ced6;--bronze:#e0955a;--red:#ff4d5a;--bg:#0f1720;--card:#18232e;--ink:#eef3f6;--mut:#8ea0ad;--line:#26333f;--acc:#ff3d7f;--deep:#ff3d7f;--wall:#2b3a47;--wall2:#6f8797;--floor:#16212b;--block:#22303c;--wallsel:#ff3d7f;--g1:#3fd28b;--g2:#ffb83d;--g3:#ff6b5b;--g4:#c49bff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
main{max-width:640px;margin:0 auto;padding-block:12px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:.2px;text-wrap:balance}
h1{font-size:36px;line-height:1}
h2{font-size:30px;line-height:1.05}
h3{font-size:22px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 13px;min-height:40px}
button:focus-visible,input:focus-visible,select:focus-visible,.zone:focus-visible{outline:3px solid var(--deep);outline-offset:1px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.on{background:var(--deep);border-color:var(--deep);color:var(--bg)}
button.dng{color:var(--g3);border-color:var(--g3)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.sub{color:var(--mut);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.who select,.who input{flex:1 1 140px}
.sec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.sec b{font:700 30px/1 var(--disp)}
.sec .pts{grid-row:1/3;grid-column:2;text-align:right;font:700 28px/1 var(--disp);font-variant-numeric:tabular-nums}
.sec .pts small{display:block;font:500 13px var(--body);color:var(--mut)}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tabs button{flex:1}
.map{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;overflow-x:auto}
.map svg{display:block;width:100%;height:auto}
.zone{cursor:pointer}
.zone .strip{stroke:var(--wall);transition:stroke .15s}
.zone:hover .strip,.zone:focus-visible .strip{stroke:var(--acc);stroke-opacity:.6}
.zone:hover .zlab{fill:var(--acc)}
.zone.sel .strip{stroke:var(--wallsel);stroke-opacity:1}
.ldot{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
.ldot.nw{stroke:var(--gold);stroke-width:3.2}
.bdot.nw{stroke:var(--gold);stroke-width:3.4}
.ldot.dn{stroke:var(--g1);stroke-width:2.6}
.ldot.off,.ldot.none.off{fill:var(--line);stroke:var(--mut);stroke-dasharray:none;opacity:1}
.lnum.off{opacity:.45}
.zone.sel .ldot.off,.zone.sel .ldot.none.off{fill:var(--line);stroke:var(--mut)}
.zone.sel .lnum.off{fill:var(--ink)}
.strike{stroke:var(--g3);stroke-width:2.6;stroke-linecap:round}
.lc.off{opacity:.6;border-style:dashed}
.lc.off s{text-decoration-thickness:2px;text-decoration-color:var(--g3)}
.ldot.none{opacity:.4;stroke-dasharray:3 2}
.zone.sel .ldot{fill:var(--acc);stroke:var(--acc)}
.zone.sel .ldot.dn{stroke:var(--g1)}
.zone.sel .lnum{fill:#fff}
.zone:hover .ldot{stroke-width:2}
.lnum{font:700 13px var(--body);fill:var(--ink)}
.zlab{font:600 15px var(--body);fill:var(--mut)}
.zlab.sel{fill:var(--acc)}
.zmain{font:700 15px var(--body);fill:var(--ink);opacity:.8}
.area{font:700 13px var(--body);letter-spacing:.14em;fill:var(--mut);opacity:.75}
.inset{fill:var(--bg);stroke:var(--mut);stroke-width:1.5}
.hint{text-align:center;color:var(--mut);padding:18px 8px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.lc>header{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
.num{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 17px var(--disp);border:2px solid var(--ink)}
.rt{border-top:1px solid var(--line)}
.rt>.hd{display:flex;gap:12px;align-items:center;width:100%;border:0;border-radius:0;background:none;padding:9px 12px;text-align:left}
.sw{width:14px;height:30px;border-radius:4px;flex:none;border:1px solid var(--line)}
.gr{font:700 24px/1 var(--disp);min-width:44px;text-align:center;margin-left:auto;border-left:3px solid currentColor;padding-left:9px;font-variant-numeric:tabular-nums}
.done{font-size:13px;color:var(--g1);font-weight:600}
.bd{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.styles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.styles button{display:flex;justify-content:space-between;gap:6px}
.styles small{color:inherit;opacity:.75;font-variant-numeric:tabular-nums}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.ed label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:3px}
.ed .full{grid-column:1/-1}
.floor{fill:var(--floor)}
.island{fill:var(--block)}
.door{fill:none;stroke:var(--mut);stroke-width:2;stroke-dasharray:6 6}
.bwall{fill:none;stroke:var(--wall2);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.bz:hover .bwall,.bz:focus-visible .bwall{stroke:var(--acc);stroke-opacity:.6}
.bz.sel .bwall{stroke:var(--wallsel);stroke-opacity:1}
.bdot{stroke:var(--ink);stroke-width:1.2}
.bdot.dn{stroke:var(--g1);stroke-width:3.5}
.hold{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.hold i{width:14px;height:14px;border-radius:3px;border:1px solid var(--mut);display:inline-block}
.bsw{width:30px;height:30px;border-radius:50%;flex:none;border:1px solid var(--mut)}
.bleg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:13px;color:var(--mut)}
.bleg span{display:flex;align-items:center;gap:5px}
.bleg i,.pip{width:12px;height:12px;border-radius:50%;border:1px solid var(--mut);display:inline-block}
.pip{margin-right:5px;vertical-align:middle}
.err{color:var(--g3);font-size:14px;font-weight:600}
.addr{margin:4px 12px 12px;width:calc(100% - 24px)}
.fl{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.fl input{width:100%;font-weight:400;font-size:16px}
button.link{background:none;border:0;color:var(--deep);font-weight:600;text-decoration:underline;padding:8px 0;align-self:flex-start}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:20;max-width:min(90vw,520px);font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rk .rkb{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:0}
.rk .rkb>span{min-width:0}
.rk .rkb.me{border-color:var(--acc);border-width:2px}
.rk .pos{font:700 24px/1 var(--disp);text-align:center;font-variant-numeric:tabular-nums}
.rk .p{font:700 24px/1 var(--disp);text-align:right;font-variant-numeric:tabular-nums}
.rk .p small{display:block;font:500 12px var(--body);color:var(--mut)}
.pod1 .pos{color:var(--g2)}
.empty{text-align:center;color:var(--mut);padding:30px 10px;background:var(--card);border:1px dashed var(--line);border-radius:10px}
.new{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--gold);color:#1b2226;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:2px}
.tag.nwtag{border-color:var(--gold);color:var(--ink);font-weight:600}
.news{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 12px 4px;margin-top:4px}
.news header{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.nit{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:9px 2px}
.nit>span{min-width:0}
.pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:0}
.pc .pos{font:700 24px/1 var(--disp)}
.pc b{font-size:14px;overflow-wrap:anywhere}
.pc small{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.pc.p1{border-color:var(--gold)}.pc.p1 .pos{color:var(--gold)}.pc.p2 .pos{color:var(--silver)}.pc.p3 .pos{color:var(--bronze)}
.pc.nope{border-style:dashed;opacity:.6}
.hc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.hc header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hc header b{font:700 22px/1.1 var(--disp)}
.ychips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.pfc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;align-items:baseline}
.kv>span{color:var(--mut)}
.kv>b{text-align:right;font-variant-numeric:tabular-nums}
.pfh{margin:18px 0 8px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
.postab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.postab th,.postab td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.postab tbody th{white-space:normal;padding-left:10px}
.postab thead th:first-child{padding-left:10px}
.postab tr:last-child th,.postab tr:last-child td{border-bottom:0}
.postab th:first-child{text-align:left;font-weight:600}
.postab thead th{color:var(--mut);font-weight:600;font-size:13px}
.med1{color:var(--gold);font-weight:700}.med2{color:var(--silver);font-weight:700}.med3{color:var(--bronze);font-weight:700}
.ai{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.ai:first-child{border-top:0}
.ai>span{min-width:0}
.ad{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.ap{font:700 20px/1 var(--disp);color:var(--g1);font-variant-numeric:tabular-nums}
.apr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line)}
.apr:first-child{border-top:0}
.apr>span{min-width:0}
.aprb{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;margin-left:4px}
.finder{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.frow select{width:100%;font-weight:400}
.frow2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:20px;height:20px;min-height:0;accent-color:var(--acc)}
.ldot.hit{fill:var(--acc);stroke:var(--acc)}
.lnum.hit{fill:#fff}
.ldot.dim,.lnum.dim{opacity:.28}
.bdot.hit{stroke:var(--acc);stroke-width:3.4}
.bdot.dim{opacity:.18}
.rgh{font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:12px 2px 4px;border-top:1px solid var(--line)}
.res .rgh+.nit{border-top:0}
.lnb{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 15px var(--disp);border:2px solid var(--ink)}
.rt.dimr{opacity:.4}
.fnote{font-size:14px;color:var(--mut);margin:-2px 0 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.fnote .link{padding:0}
.rbtn{width:100%;margin-top:14px;background:none;border-style:dashed;color:var(--red);font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.rbtn::before,.rbtn::after{color:var(--gold);font-size:15px;letter-spacing:-1px}
.rbtn::before{content:"\25B6\25B6"}
.rbtn::after{content:"\25C0\25C0"}
.rl{display:flex;flex-direction:column;gap:10px;max-width:62ch}
.rl h3{margin-top:10px}
.rl p,.rl ul{margin:0}
.rl ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.mult,.gpt{display:grid;gap:6px}
.mult{grid-template-columns:repeat(3,1fr)}
.gpt{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.mult div,.gpt div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column}
.mult b,.gpt b{font:700 22px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.mult span,.gpt span{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
/* Carga rápida de boulder (modo editor) */
.has .bz:not(.sel) .bwall,.has .bz:not(.sel) .bdots{opacity:.35}.has .bz:not(.sel) .zlab{opacity:.4}
.has .bz.sel .bwall{stroke-width:18}.has .bz.sel .zlab{font-weight:700;font-size:19px}
.bdot.jst{stroke:var(--g1);stroke-width:3.6}
@media (prefers-reduced-motion:no-preference){.bdot.jst{animation:qblink 1s ease 2}@keyframes qblink{50%{r:14}}}
.qhere{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--acc);color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin:0 0 10px}
.qhere small{display:block;font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.qhere b{font:700 30px/1 var(--disp)}.qhere span{flex:1;min-width:0}
.qhere button{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.qk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.qstep{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.qstep i{font:700 13px var(--body);font-style:normal;background:var(--ink);color:var(--bg);border-radius:99px;width:22px;height:22px;display:inline-grid;place-items:center;flex:none}
.qstep.ok i{background:var(--g1)}
.qd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qd button,.qh button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;font-size:13px}
.qd button.on{background:var(--card);color:var(--ink);border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.qd.pk button:not(.on){opacity:.45}
.qd i{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink)}
.qh{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qh i{width:30px;height:18px;border-radius:5px;border:1.5px solid var(--ink)}
.qh.off{opacity:.35;pointer-events:none}
.qk label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:14px}
.qren{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.toast{display:flex;gap:12px;align-items:center;width:max-content}
.toast button{background:transparent;color:var(--bg);border-color:var(--bg);min-height:34px;padding:2px 10px;flex:none}
/* Estadísticas del perfil */
.cmpw{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp .big{font:700 28px/1 var(--disp);font-variant-numeric:tabular-nums}
.dl{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.dl.up{color:var(--g1)}.dl.dw{color:var(--g3)}.dl.eq{color:var(--mut)}
.cmp .kv{font-size:13px}
.pyr{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.pyr .pr{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.pyr .pr b{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pyr .pt{height:20px;display:flex;justify-content:center}
.pyr .pb{height:100%;border-radius:4px;min-width:4px}
.pyr .pn{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.pyr .pr.z .pn{opacity:.5}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.ptabs button{flex:1;min-height:36px;padding:4px 10px}
/* Corona del líder y movimientos de puesto en las últimas 24 h */
.rk .pos{position:relative}
.crown{display:block;width:26px;height:16px;margin:0 auto 1px;color:var(--gold)}
.mv{display:block;font:600 11px/1.1 var(--body);margin-top:2px;white-space:nowrap}
.mv.dw{color:var(--g3)}.mv.up{color:var(--g1)}

  if(!S.me||!me()){$("#app").innerHTML=`<h2>Logros</h2><div class="empty">${S.me?"Tus logros aparecerán cuando el administrador apruebe tu cuenta.":"Entra con tu cuenta para ver tus logros."}</div>${S.me?"":'<button class="pri" id="lg">Entrar</button>'}`;if($("#lg"))$("#lg").onclick=needLogin;return}
  const y=new Date().getFullYear(),all=computeLogros(y),mine=all[S.me]||{},got=LCAT.filter(c=>mine[c.id]?.ok),R=2*Math.PI*33;
  const near=LCAT.filter(c=>!mine[c.id]?.ok&&mine[c.id]?.v>0).sort((a,b)=>mine[b.id].v/mine[b.id].m-mine[a.id].v/mine[a.id].m)[0];
  const f=S.lsec||"cuerda",recent=id=>mine[id]?.ok&&(Date.now()-new Date(mine[id].at))<7*864e5;

  feed.sort((a,b)=>b.at.localeCompare(a.at));const nm=Object.fromEntries(S.users.map(u=>[u.id,u.name]));

  $("#app").innerHTML=`<h2>Logros ${y}</h2><p class="sub" style="margin:-4px 0 12px">Se ganan solos con lo que marcas. El 1 de enero empiezan de cero y los de cada año quedan en tu vitrina.</p>
  <div class="lsum"><div class="ringw"><svg viewBox="0 0 78 78"><circle cx="39" cy="39" r="33" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="39" cy="39" r="33" fill="none" stroke="url(#lrg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${R*got.length/LCAT.length} ${R}" transform="rotate(-90 39 39)"/><defs><linearGradient id="lrg"><stop offset="0" stop-color="#ff3d7f"/><stop offset="1" stop-color="#ffc53d"/></linearGradient></defs></svg><b>${got.length}<small>de ${LCAT.length}</small></b></div>
   <div><div class="lsumt">Tus insignias</div><div class="ltiers">${[...LORDER].reverse().map(t=>`<span title="${LTIER[t][2]}"><i style="background:linear-gradient(135deg,${LTIER[t][0]},${LTIER[t][1]})"></i>${got.filter(c=>c.t===t).length}</span>`).join("")}</div></div></div>

  <div class="lchips" role="tablist">${LSECS.map(([k,n])=>`<button role="tab" aria-selected="${k===f}" class="${k===f?"on":""}" data-ls="${k}">${n} · ${got.filter(c=>c.sec===k).length}/${LCAT.filter(c=>c.sec===k).length}</button>`).join("")}</div>
  <div class="lbadges">${LCAT.filter(c=>c.sec===f).map(c=>{const x=mine[c.id]||{v:0,m:1};return `<button class="lbd ${x.ok?"":"off"} ${recent(c.id)?"new":""}" data-lg="${c.id}">${medal(c.p,c.t)}<span class="nm ${c.n.split(" ").some(w=>w.length>11)?"lw":""}">${esc(c.n)}</span>${x.ok?`<span class="ds">${recent(c.id)?"¡Nueva!":LTIER[c.t][2]}</span>`:`<span class="pg">${x.v} / ${x.m}<span class="lbar"><span style="width:${x.v/x.m*100}%"></span></span></span>`}</button>`}).join("")}</div>

  <div id="lsheet"></div>`;
  document.querySelectorAll("[data-ls]").forEach(b=>b.onclick=()=>{S.lsec=b.dataset.ls;const y0=scrollY;logrosView();scrollTo(0,y0)});
  document.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>logroSheet(b.dataset.lg,all))}
function logroSheet(id,all){const c=LCAT.find(x=>x.id===id),x=all[S.me]?.[id]||{v:0,m:1},col=LTIER[c.t][0],who=Object.entries(all).filter(([u,o])=>o[id]?.ok&&u!==S.me).map(([u])=>S.users.find(v=>v.id===u)?.name).filter(Boolean);

function login(){
  const reg=!!S.reg;
  $("#app").innerHTML=`<div class="top"><button id="bk">Volver</button></div><article class="rl"><h2>${reg?"Crear cuenta":"Entrar"}</h2>
  <p class="sub">${reg?"Es la misma cuenta que en «El grado es subjetivo». Cuando la crees, el administrador tiene que aprobarla antes de que puedas marcar vías.":"Entra con la misma cuenta que usas en «El grado es subjetivo»."}</p>
  <form id="lf" class="stack" novalidate>
  ${reg?`<label class="fl" for="ln">Nombre en el ranking<input id="ln" required minlength="2" maxlength="30" autocomplete="nickname"></label>
  <label class="fl" for="li">¿Quién te invita?<input id="li" required maxlength="60" placeholder="Nombre de quien te ha pasado el enlace"></label>`:""}
  <label class="fl" for="le">Correo<input id="le" type="email" required autocomplete="email"></label>
  <label class="fl" for="lp">Contraseña${reg?" (mínimo 6 caracteres)":""}<input id="lp" type="password" required minlength="6" autocomplete="${reg?"new-password":"current-password"}"></label>
  <span class="err" id="lerr" role="alert" hidden></span>
  <button class="pri" type="submit" id="lgo">${reg?"Crear cuenta":"Entrar"}</button></form>
  <button id="sw" class="link">${reg?"Ya tengo cuenta: entrar":"No tengo cuenta: crear una"}</button>${reg?"":`<button id="fg" class="link">He olvidado mi contraseña</button>`}</article>`;
  if($("#fg"))$("#fg").onclick=()=>{S.fem=$("#le").value.trim();S.view="forgot";render()};
  $("#bk").onclick=()=>{S.view=S.back||"home";render()};
  $("#sw").onclick=()=>{S.reg=!reg;login()};
  const err=t=>{const e=$("#lerr");e.textContent=t;e.hidden=false};
  $("#lf").onsubmit=async e=>{e.preventDefault();const em=$("#le").value.trim(),pw=$("#lp").value,nm=reg?$("#ln").value.trim():"",iv=reg?$("#li").value.trim():"";
    if(reg&&nm.length<2)return err("Escribe un nombre de al menos 2 letras.");
    if(reg&&iv.length<2)return err("Escribe quién te ha invitado.");
    if(!em.includes("@"))return err("Escribe un correo válido.");
    if(pw.length<6)return err("La contraseña necesita al menos 6 caracteres.");
    if(reg&&S.people.some(u=>u.name.toLowerCase()===nm.toLowerCase()))return err("Ese nombre ya lo usa otro escalador. Elige otro.");
    $("#lgo").disabled=true;
    const r=reg?await sb.auth.signUp({email:em,password:pw,options:{data:{name:nm,invited_by:iv}}}):await sb.auth.signInWithPassword({email:em,password:pw});
    $("#lgo").disabled=false;
    if(r.error)return err(/Invalid login/i.test(r.error.message)?"Correo o contraseña incorrectos.":/registered/i.test(r.error.message)?"Ya hay una cuenta con ese correo. Pulsa “Ya tengo cuenta: entrar”.":r.error.message);
    if(reg&&!r.data.session)err("Te hemos mandado un correo para confirmar la cuenta. Ábrelo y después entra aquí.");
  };
}

  <button class="pri" type="submit" id="fgo">Mandar el enlace</button></form></article>`;

/* Administrador: aprobar o quitar escaladores (compartido con «El grado es subjetivo») */
function approvals(){
  const ps=S.pend||[],pe=ps.filter(p=>!p.approved&&p.user_id!==S.me),ap=ps.filter(p=>p.approved&&p.user_id!==S.me);
  const row=(p,btns)=>`<div class="apr"><span><b>${esc(p.name)}</b>${p.invited_by?`<br><span class="sub">Invitado por ${esc(p.invited_by)}</span>`:""}</span><span class="aprb">${btns}</span></div>`;

  <p class="sub" style="margin:4px 0 12px">Las aprobaciones valen para las dos apps. «Monta vías» deja a ese escalador añadir, cambiar y desmontar vías de cuerda y autoseguro, también subiendo la foto de la tablilla. «Monta boulder» hace lo mismo con los bloques de boulder.</p>

const FQ=()=>S.fq?.[S.sec]||((S.fq=S.fq||{})[S.sec]={min:"",max:"",hold:"",col:"",todo:false});
const fOn=f=>!!(f.min||f.max||f.hold||f.col||f.todo);
function fMatch(r,f){
  if(f.hold&&r.hold!==f.hold)return false;
  if(f.todo&&myAsc(r.id))return false;
  if(r.sec==="boulder")return !f.col||r.color===f.col;
  const i=GRADES.indexOf(r.grade);
  if(f.min&&i<GRADES.indexOf(f.min))return false;
  if(f.max&&i>GRADES.indexOf(f.max))return false;
  return true}
const fHits=()=>{const f=FQ();return fOn(f)?S.routes.filter(r=>r.sec===S.sec&&r.active&&!isOff(r.line)&&fMatch(r,f)):null};
function finderHtml(){const f=FQ(),bl=S.sec==="boulder",opt=(v,l,cur)=>`<option value="${v}" ${v===cur?"selected":""}>${l}</option>`;
  return `<section class="finder" aria-label="Buscar ${bl?"bloques":"vías"}"><div class="frow">
  ${bl?`<label class="fl" for="fcol">Dificultad<select id="fcol">${opt("","Todas",f.col)}${BKEYS.map(k=>opt(k,BCOL[k][0],f.col)).join("")}</select></label>`
    :`<label class="fl" for="fmin">Grado desde<select id="fmin">${opt("","Cualquiera",f.min)}${GRADES.map(g=>opt(g,g,f.min)).join("")}</select></label>
  <label class="fl" for="fmax">hasta<select id="fmax">${opt("","Cualquiera",f.max)}${GRADES.map(g=>opt(g,g,f.max)).join("")}</select></label>`}
</div>
  <div class="frow2">${S.me?`<label class="chk" for="ftd"><input type="checkbox" id="ftd" ${f.todo?"checked":""}> Solo ${bl?"los":"las"} que no he hecho este bimestre</label>`:"<span></span>"}
  ${fOn(f)?`<button class="link" id="fclr">Quitar filtros</button>`:""}</div></section>`}
function bindFinder(view){const f=FQ(),set=(k,v)=>{f[k]=v;S.zone=null;S.open=null;view()};
  [["fmin","min"],["fmax","max"],["fh","hold"],["fcol","col"]].forEach(([id,k])=>{const e=$("#"+id);if(e)e.onchange=()=>{const v=e.value;
    if(k==="min"&&v&&f.max&&GRADES.indexOf(f.max)<GRADES.indexOf(v))f.max="";if(k==="max"&&v&&f.min&&GRADES.indexOf(f.min)>GRADES.indexOf(v))f.min="";set(k,v)}});
  if($("#ftd"))$("#ftd").onchange=e=>set("todo",e.target.checked);
  if($("#fclr"))$("#fclr").onclick=()=>{Object.assign(f,{min:"",max:"",hold:"",col:"",todo:false});S.zone=null;S.open=null;view()}}
function resultsHtml(){const hs=fHits();if(!hs)return null;const bl=S.sec==="boulder";
  if(!hs.length)return `<div class="empty">No hay ${bl?"bloques":"vías"} que cumplan el filtro. Prueba a ampliar el grado o quitar algún filtro.</div>`;
  const groups=bl?BSECT.map(z=>({name:z.name,rs:hs.filter(r=>r.zone===z.id)})):ZONES[S.sec].slice().sort((a,b)=>a.lo-b.lo).map(z=>({name:z.name,rs:hs.filter(r=>LINES[r.line]?.zone===z.id).sort((a,b)=>a.line-b.line||GRADES.indexOf(a.grade)-GRADES.indexOf(b.grade))}));
  return `<section class="news res" aria-label="Resultados"><header><h3>${hs.length} ${bl?(hs.length===1?"bloque encontrado":"bloques encontrados"):(hs.length===1?"vía encontrada":"vías encontradas")}</h3><span class="sub">Toca una para ir a ella. En el mapa están resaltadas.</span></header>
  ${groups.filter(g=>g.rs.length).map(g=>`<div class="rgh">${g.name.replace("Exterior · ","Exterior, ")}</div>${g.rs.map(r=>bl
    ?`<button class="nit" data-nr="${r.id}"><span class="bsw" style="background:${bbg(r.color)}"></span><span><b>${BCOL[r.color]?.[0]||""}</b>${isNew(r)?NEWBM:""}<br><span class="sub">${HOLDS[r.hold]?"Presas "+HOLDS[r.hold][0].toLowerCase():"Presas sin indicar"}${myAsc(r.id)?" · hecho":""}</span></span></button>`
    :`<button class="nit" data-nr="${r.id}"><span class="lnb">${r.line}</span><span class="sw" style="background:${HOLDS[r.hold]?.[1]}"></span><span><b>Línea ${r.line}</b> · ${HOLDS[r.hold]?.[0]||""}${isNew(r)?NEWB:""}${myAsc(r.id)?'<br><span class="done">Hecha este bimestre</span>':""}</span><span class="gr" style="color:${gcol(r.grade)}">${r.grade}</span></button>`).join("")}`).join("")}</section>`}

function mapSvg(){
  let g="";
  const f=v=>v.toFixed(1),hl=fHits(),HS=hl?new Set(hl.map(r=>r.id)):null;
  ZONES[S.sec].forEach(z=>{const sel=S.zone===z.id;const[p,q]=z.pts;const L=Math.hypot(q[0]-p[0],q[1]-p[1]);const dx=(q[0]-p[0])/L,dy=(q[1]-p[1])/L;
    const s=[p[0]+dx*GAP,p[1]+dy*GAP],e=[q[0]-dx*GAP,q[1]-dy*GAP],d=`M${f(s[0])} ${f(s[1])} L${f(e[0])} ${f(e[1])}`;
    let dots="";for(let i=0;i<z.n;i++){const num=z.nums[i];const[x,y]=lerp(p,q,(i+.5)/z.n);const rs=routesOf(num),dn=rs.some(r=>myAsc(r.id)),nw=rs.some(isNew);
      const off=isOff(num),hit=HS?rs.some(r=>HS.has(r.id)):null;
      dots+=`<circle class="ldot ${nw?"nw":""} ${dn?"dn":""} ${rs.length?"":"none"} ${off?"off":""} ${hit===true?"hit":hit===false?"dim":""}" cx="${f(x)}" cy="${f(y)}" r="11"/><text class="lnum ${off?"off":""} ${hit===true?"hit":hit===false?"dim":""}" x="${f(x)}" y="${f(y+4.5)}" text-anchor="middle">${num}</text>${off?`<line class="strike" x1="${f(x-9)}" y1="${f(y)}" x2="${f(x+9)}" y2="${f(y)}"/>`:""}`}
    const nx=-dy*z.side,ny=dx*z.side,m=lerp(p,q,.5),lx=m[0]+nx*24,ly=m[1]+ny*24+4,anc=nx>.3?"start":nx<-.3?"end":"middle";
    g+=`<g class="zone ${sel?"sel":""}" data-z="${z.id}" tabindex="0" role="button" aria-label="${z.name}, líneas ${z.lo} a ${z.hi}"><path class="strip" d="${d}" fill="none" stroke-width="${z.wide?22:18}" stroke-linecap="butt"/><path d="${d}" fill="none" stroke="transparent" stroke-width="34" stroke-linecap="butt"/>${dots}
    <text class="zlab ${sel?"sel":""}" x="${f(lx)}" y="${f(ly)}" text-anchor="${anc}">${z.name.replace("Exterior · ","")}</text></g>`});
  return `<svg viewBox="0 0 ${VB.w} ${VB.h}" role="img" aria-label="Vista cenital de la zona de cuerda">
    <rect class="inset" x="${BOX.x}" y="${BOX.y}" width="${BOX.w}" height="${BOX.h}" rx="6"/>
    <text class="area" x="${BOX.x+12}" y="${BOX.y+20}">ZONA EXTERIOR</text>${g}</svg>`}

function mapView(){
  const z=ZONES[S.sec]?.find(x=>x.id===S.zone);
  $("#body").innerHTML=`${S.edit&&ZONES[S.sec]?tBox():""}${ZONES[S.sec]?finderHtml():""}<div class="map">${mapSvg()}</div><div id="zp" style="margin-top:12px"></div>`;
  if(ZONES[S.sec])bindFinder(mapView);if(S.edit)bindTBox();
  document.querySelectorAll(".zone").forEach(el=>{const go=()=>{S.zone=el.dataset.z;S.open=null;S.arm=null;mapView();$("#zp").scrollIntoView({behavior:"smooth",block:"start"})};el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  if(!ZONES[S.sec])return;
  if(!z){const res=resultsHtml();$("#zp").innerHTML=res??`<div class="hint">Toca una pared en el mapa para ver sus líneas y vías.</div>${newsBox()}`;bindNews(mapView);return}
  const fl=fOn(FQ())?`<div class="fnote">Con el filtro activo, las vías que no lo cumplen salen atenuadas. <button class="link" id="fback">Volver a los resultados</button></div>`:"";
  let html=`<div class="top" style="margin:0 0 8px"><h3>${z.name}</h3><span class="sub">Líneas ${z.lo}–${z.hi}</span></div>${fl}`;
  for(const num of [...z.nums].sort((a,b)=>a-b)){const rs=routesOf(num);
    if(isOff(num)&&!rs.length){html+=`<section class="lc off" aria-label="Línea ${num}, no se usa"><header><span class="num">${num}</span><b><s>Línea ${num}</s></b><span class="sub">· No se usa</span></header></section>`;continue}
    html+=`<section class="lc" aria-label="Línea ${num}"><header><span class="num">${num}</span><b>Línea ${num}</b><span class="sub">· ${rs.length} ${rs.length===1?"vía":"vías"}</span></header>
    ${rs.map(routeRow).join("")||`<div class="rt"><div class="hint" style="padding:10px">Sin vías montadas.</div></div>`}
    ${S.edit?`<button class="addr" data-add="${num}">Añadir vía a la línea ${num}</button>`:""}</section>`}
  $("#zp").innerHTML=html;
  if($("#fback"))$("#fback").onclick=()=>{S.zone=null;S.open=null;mapView()};
  bindRoutes();
}
/* Iconos de estilo en la tablilla: a vista = ojo, flash = rayo, encadenada = cadena */
const STY={"A vista":["s-av",`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.3" fill="currentColor"/></svg>`],
 "Flash":["s-fl",`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6.2L9.5 22l9-12h-6.3z" fill="currentColor"/></svg>`],
 "Encadenada":["s-en",`<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a4.2 4.2 0 0 0 6 0l3-3a4.2 4.2 0 0 0-6-6l-1.2 1.2"/><path d="M14 10a4.2 4.2 0 0 0-6 0l-3 3a4.2 4.2 0 0 0 6 6l1.2-1.2"/></g></svg>`]};
function routeRow(r){
  const h=HOLDS[r.hold]||["Sin color","var(--line)"],a=myAsc(r.id),open=S.open===r.id;
  const f=FQ(),dim=fOn(f)&&!fMatch(r,f),dd=r.created?r.created.split("-").reverse().join("."):"";
  return `<div class="rt ${dim?"dimr":""}"><button class="hd tbl" data-r="${r.id}" aria-expanded="${open}"><span class="tb-bar" style="background:${h[1]}"></span>
  <span class="tb-main"><span class="tb-top">${r.line} · ${h[0]}${isNew(r)?NEWB:""}${S.proj.has(r.id)?PJS:""}</span><span class="tb-gr">${r.grade}</span></span>
  <span class="tb-side"><span class="tb-date">${dd}</span>${a?`<span class="sty ${STY[a.style]?.[0]||""}${S.jm===r.id?" pop":""}" title="${a.style}">${STY[a.style]?.[1]||""}<span><b>${a.style}</b>+${pts(a)} pts</span></span>`:`<span class="sub">Sin hacer</span>`}</span></button>
  ${open?`<div class="bd"><div class="sub">¿Cómo la has hecho? Puntos base del ${r.grade}: ${GP[r.grade]}</div>
  <div class="styles">${STYLES.map(([st,m])=>`<button data-st="${st}" class="sbi ${a&&a.style===st?"on":""}">${STY[st]?.[1]||""}${st}<small>+${Math.round(GP[r.grade]*m)}</small></button>`).join("")}</div>
  ${fwHtml(r)}${projBtn(r)}${a?`<button class="dng" id="rm">${S.arm==="rm"?"Pulsa otra vez para quitarla":"Quitar mi encadene"}</button>`:""}
  ${S.edit?`<div class="ed"><label>Grado<select id="eg">${GRADES.map(g=>`<option ${g===r.grade?"selected":""}>${g}</option>`).join("")}</select></label>
  <label class="full">Fecha de creación<input type="date" id="ec" value="${r.created||""}" max="${isoDay(new Date())}"></label>
  <label>Color de presas<select id="eh">${Object.entries(HOLDS).map(([k,v])=>`<option value="${k}" ${k===r.hold?"selected":""}>${v[0]}</option>`).join("")}</select></label>
  <span class="err full" id="eerr" role="alert" hidden></span>
  <button class="pri" id="esv">Guardar cambios</button><button class="dng" id="edl">${S.arm==="del"?"Pulsa otra vez: desmontar":"Desmontar vía"}</button>
  <span class="sub full">Corrige el grado o el color con “Guardar cambios”. Cuando se quite la vía de la pared, usa “Desmontar vía”: los encadenes que ya tenía siguen contando en el ranking.</span></div>`:""}
  </div>`:""}</div>`}
function bindRoutes(){
  document.querySelectorAll(".hd").forEach(b=>b.onclick=()=>{S.open=S.open===b.dataset.r?null:b.dataset.r;S.arm=null;mapView()});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const num=+b.dataset.add;const used=new Set(routesOf(num).map(r=>r.hold));const hold=Object.keys(HOLDS).find(k=>!used.has(k))||"amarilla";
    S.arm=null;addRoute({sec:S.sec,line:num,grade:"6a",hold,created:isoDay(new Date())})});
  const r=S.routes.find(x=>x.id===S.open);if(!r)return;
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>markAscent(r,b.dataset.st));
  if($("#pj"))$("#pj").onclick=()=>toggleProj(r);
  if($("#rm"))$("#rm").onclick=()=>{if(S.arm!=="rm"){S.arm="rm";return mapView()}S.arm=null;unmark(r)};
  if(S.edit){
    $("#esv").onclick=()=>{const hold=$("#eh").value,created=$("#ec").value;
      const twin=S.routes.find(x=>x!==r&&x.active&&x.sec===r.sec&&x.line===r.line&&x.hold===hold&&(x.created||"")===created);
      if(twin){const e=$("#eerr");e.textContent=`Ya hay una vía ${HOLDS[hold][0].toLowerCase()} en la línea ${r.line} con esa fecha de creación. Cambia el color o la fecha.`;e.hidden=false;return}
      updRoute(r.id,{grade:$("#eg").value,hold,created:created||null})};
    $("#edl").onclick=()=>{if(S.arm!=="del"){S.arm="del";return mapView()}S.arm=null;S.open=null;updRoute(r.id,{active:false})}}

const unit=(n,sec)=>`${n} ${isBl(sec)?(n===1?"bloque":"bloques"):(n===1?"vía":"vías")}`;
const CROWN=`<svg class="crown" viewBox="0 0 26 16" aria-hidden="true"><path fill="currentColor" d="M2 4l5 4 6-7 6 7 5-4-2 11H4z"/><circle cx="2" cy="3.5" r="1.8" fill="currentColor"/><circle cx="13" cy="1.6" r="1.8" fill="currentColor"/><circle cx="24" cy="3.5" r="1.8" fill="currentColor"/></svg>`;
/* Puesto de cada uno hace 24 h, para marcar quién ha bajado o subido */
function moves(sec){const{from,to}=period("bim"),ago=new Date(Date.now()-864e5);if(ago<=from)return null;const m={};rankRange(sec,from,ago).forEach((x,i)=>m[x.id]=i+1);return m}
const mvTag=(m,id,i)=>{if(!m||!m[id])return"";const d=m[id]-(i+1);return d<0?`<span class="mv dw" title="Hace 24 h iba ${m[id]}.º">▼ ${-d}</span>`:d>0?`<span class="mv up" title="Hace 24 h iba ${m[id]}.º">▲ ${d}</span>`:""};
function rkList(r,year,m){return `<ol class="rk">${r.map((x,i)=>`<li><button class="rkb ${x.id===S.me?"me":""} ${i===0?"pod1":""}" data-u="${x.id}" aria-label="${i===0?"Líder: ":""}${esc(x.name)}"><span class="pos">${i===0?CROWN:""}${i+1}${mvTag(m,x.id,i)}</span><span><b>${esc(x.name)}</b><br><span class="sub">${year?x.hist.map(h=>`${BIM[h.b]} ${h.pos}.º${h.live?" (en curso)":""}`).join(" · "):unit(x.n,S.sec)}</span></span><span class="p">${fmt(x.p)}<small>${year?"pts de liga":"puntos"}</small></span></button></li>`).join("")}</ol>`}
function podium(r,year){return `<div class="pod">${[0,1,2].map(i=>{const x=r[i];return x?`<button class="pc p${i+1}" data-u="${x.id}"><span class="pos">${i+1}.º</span><b>${esc(x.name)}</b><small>${fmt(x.p)} ${year?"pts de liga":"pts"}</small></button>`:`<div class="pc nope"><span class="pos">${i+1}.º</span><small>Sin puntuar</small></div>`}).join("")}</div>`}
const years=()=>{const ys=new Set(S.asc.map(a=>new Date(a.at).getFullYear()));ys.add(new Date().getFullYear());return[...ys].sort((a,b)=>b-a)};
function closedBims(y){const n=new Date(),cy=n.getFullYear();return Array.from({length:y<cy?6:y===cy?Math.floor(n.getMonth()/2):0},(_,b)=>b)}
function hcard(title,r,year,k){const open=S.hopen===k;
  return `<section class="hc"><header><b>${title}</b><span class="sub">${r.length?(r.length===1?"1 escalador":r.length+" escaladores"):"Nadie puntuó"}</span></header>
  ${r.length?podium(r,year)+(r.length>3?`<button class="link" data-hk="${k}" aria-expanded="${open}">${open?"Ocultar clasificación":"Ver clasificación completa"}</button>${open?rkList(r,year):""}`:""):""}</section>`}
function histHtml(){
  const cy=new Date().getFullYear(),y=S.hy||cy,ys=years(),bs=closedBims(y).reverse();
  let h=ys.length>1?`<div class="ychips">${ys.map(v=>`<button data-hy="${v}" class="${v===y?"on":""}">${v}</button>`).join("")}</div>`:"";
  h+=`<p class="sub" style="margin:0 0 10px">Clasificación final de cada bimestre ya terminado. Toca un nombre para ver su perfil.</p>`;
  if(y<cy)h+=hcard(`Anual ${y} · clasificación final`,annual(S.sec,y),true,"a"+y);
  if(!bs.length)h+=`<div class="empty">Aún no ha terminado ningún bimestre en ${y}. Cuando acabe ${BIM[0]}, su podio aparecerá aquí.</div>`;
  bs.forEach(b=>{h+=hcard(`${BIM[b]} ${y}`,rankRange(S.sec,new Date(y,b*2,1),new Date(y,b*2+2,1)),false,y+"-"+b)});
  return h}
function rankView(){
  let html;
  if(S.rmode==="hist")html=histHtml();
  else{const p=period(S.rmode),r=ranking(S.sec,S.rmode);
    html=`<div class="sub" style="margin-bottom:10px">${p.label}${S.rmode==="bim"?` · se reinicia en ${daysLeft()} días`:" · suma de puntos de liga (10 al 1.º … 1 al 10.º de cada bimestre)"}</div>
    ${r.length?rkList(r,S.rmode==="year",S.rmode==="bim"?moves(S.sec):null):`<div class="empty">Nadie ha puntuado todavía en ${SECTIONS.find(s=>s.id===S.sec).name.toLowerCase()} en este periodo. ${S.sec==="kilter"?"Sube la captura de un bloque desde «Mis bloques».":"Marca tus vías desde el mapa."}</div>`}`}
  $("#body").innerHTML=`<div class="rsrch"><input type="search" id="rsq" placeholder="Buscar escalador" aria-label="Buscar un escalador por nombre" autocomplete="off" value="${esc(S.rsq||"")}"><div id="rsr" class="rsr"></div></div><div class="tabs"><button id="rb" class="${S.rmode==="bim"?"on":""}">Bimestre</button><button id="ry" class="${S.rmode==="year"?"on":""}">Anual</button><button id="rh" class="${S.rmode==="hist"?"on":""}">Historial</button></div>${html}<button class="rbtn" id="rls">Cómo se puntúa</button>`;
  $("#rls").onclick=openRules;
  const sq=$("#rsq"),fill=()=>{const v=sq.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");S.rsq=sq.value;const box=$("#rsr");
    if(!v){box.innerHTML="";return}
    const bim=ranking(S.sec,"bim"),hits=S.users.filter(u=>u.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(v)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8);
    box.innerHTML=hits.length?hits.map(u=>{const i=bim.findIndex(x=>x.id===u.id);return `<button class="rsi" data-u="${u.id}"><b>${esc(u.name)}</b>${S.fol.has(u.id)?' <span class="sub">· la sigues</span>':""}<span class="sub">${i>=0?`${i+1}.º en ${SECTIONS.find(x=>x.id===S.sec).name.toLowerCase()} · ${fmt(bim[i].p)} pts`:"Sin puntos este bimestre"}</span></button>`}).join(""):`<div class="sub" style="padding:6px 2px">Nadie se llama así en la liga.</div>`;
    box.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>openProfile(b.dataset.u))};
  sq.oninput=fill;fill();
  $("#rb").onclick=()=>{S.rmode="bim";rankView()};$("#ry").onclick=()=>{S.rmode="year";rankView()};$("#rh").onclick=()=>{S.rmode="hist";rankView()};
  document.querySelectorAll("#body [data-u]").forEach(b=>b.onclick=()=>openProfile(b.dataset.u));
  document.querySelectorAll("[data-hk]").forEach(b=>b.onclick=()=>{S.hopen=S.hopen===b.dataset.hk?null:b.dataset.hk;rankView()});
  document.querySelectorAll("[data-hy]").forEach(b=>b.onclick=()=>{S.hy=+b.dataset.hy;S.hopen=null;rankView()});
}

  d.innerHTML='<span>Hay una versión nueva de la app</span><button id="updgo">Actualizar</button>';document.body.appendChild(d);document.getElementById("updgo").onclick=()=>location.reload()}
async function forceRefresh(){try{const r=await navigator.serviceWorker?.getRegistration();await r?.update();const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}location.reload()}
if("serviceWorker" in navigator)window.addEventListener("load",async()=>{try{
  const had=!!navigator.serviceWorker.controller,reg=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)showUpdate()});
  const check=()=>reg.update().catch(()=>{});document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});setInterval(check,30*6e4)}catch(e){}});
</script>
